<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 290" fill="none">
  <defs>
    <linearGradient id="cableGrad" x1="40" y1="60" x2="200" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a99"/>
      <stop offset="60%" stop-color="#3050c0"/>
      <stop offset="100%" stop-color="#4a6ad0"/>
    </linearGradient>
    <linearGradient id="connGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a42b0"/>
      <stop offset="100%" stop-color="#1a2e80"/>
    </linearGradient>
  </defs>

  <!-- Orange dot (the dot of lowercase i, floating above P) -->
  <circle cx="50" cy="28" r="22" fill="#f7941d"/>

  <!-- Cable stem — vertical line of the P -->
  <line x1="50" y1="54" x2="50" y2="205"
        stroke="url(#cableGrad)" stroke-width="20" stroke-linecap="round"/>

  <!-- Cable bowl of the P: curves from stem at ~y=80, goes right and around, back to stem at ~y=128 -->
  <path d="M50,78 C50,46 200,40 200,88 C200,132 50,128 50,128"
        stroke="url(#cableGrad)" stroke-width="20" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- RJ45 Ethernet connector at the top-right end of the cable -->
  <!-- Body of plug -->
  <rect x="188" y="42" width="44" height="28" rx="4" fill="#1e3a99"/>
  <rect x="188" y="42" width="44" height="28" rx="4" fill="url(#connGrad)"/>
  <!-- Gold/orange pins on top of connector -->
  <rect x="193" y="42" width="5" height="10" rx="1.5" fill="#f7941d"/>
  <rect x="201" y="42" width="5" height="10" rx="1.5" fill="#f7941d"/>
  <rect x="209" y="42" width="5" height="10" rx="1.5" fill="#f7941d"/>
  <rect x="217" y="42" width="5" height="10" rx="1.5" fill="#f7941d"/>
  <!-- Connector tab/clip -->
  <rect x="196" y="68" width="28" height="5" rx="2" fill="#162d80"/>

  <!-- PIVOT text -->
  <text x="130" y="240"
        font-family="'Arial Black', Arial, sans-serif"
        font-weight="900"
        font-size="62"
        fill="#1e3a99"
        text-anchor="middle"
        letter-spacing="2">PIVOT</text>

  <!-- Subtitle -->
  <text x="130" y="264"
        font-family="Arial, sans-serif"
        font-weight="400"
        font-size="14"
        fill="#1e3a99"
        text-anchor="middle"
        letter-spacing="0.5">Communication &amp; Structure</text>
  <text x="130" y="281"
        font-family="Arial, sans-serif"
        font-weight="400"
        font-size="14"
        fill="#1e3a99"
        text-anchor="middle"
        letter-spacing="0.5">Cabling Solutions</text>
</svg>
